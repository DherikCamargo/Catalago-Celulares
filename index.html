<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo de Celulares</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0f17;color:#fff}.wrap{max-width:1200px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#111827,#1f2937);border:1px solid #263247;border-radius:24px;padding:28px}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)}.hero p{margin:0;color:#b6c0cf}.controls{display:grid;grid-template-columns:1fr;gap:12px;margin:22px 0}.search{display:flex;gap:10px;align-items:center;background:#131a25;border:1px solid #263247;border-radius:14px;padding:0 14px}.search input{width:100%;padding:14px 0;background:transparent;border:0;color:#fff;outline:none;font-size:16px}.filters{display:flex;gap:10px;flex-wrap:wrap}.filter{border:1px solid #2b3649;background:#111827;color:#dbe4f0;border-radius:999px;padding:10px 14px;cursor:pointer}.filter.active{background:#fff;color:#0b0f17}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{overflow:hidden;background:#111827;border:1px solid #263247;border-radius:20px;display:flex;flex-direction:column}.photo{height:255px;background:#fff;display:flex;align-items:center;justify-content:center;padding:14px;position:relative}.photo img{width:100%;height:100%;object-fit:contain;display:block}.photo .fallback{display:none;color:#64748b;font-weight:700;text-align:center}.content{padding:18px;display:flex;flex-direction:column;gap:11px;flex:1}.brand{font-size:12px;color:#91a4bd;text-transform:uppercase;letter-spacing:.12em}.name{font-size:20px;font-weight:800}.specs,.colors,.small{color:#b8c2d0;font-size:14px}.price{font-size:28px;font-weight:900;margin-top:auto}.pix{font-size:12px;color:#8fe8b4}.installment{background:#182233;border-radius:12px;padding:10px 12px;font-size:14px}.installment strong{font-size:17px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}.primary{background:#25D366;color:#08120c}.secondary{background:#1b2432;color:#fff;border:1px solid #2d3a50}.cardbtn{background:#eef2ff;color:#101827}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}.cartbar{position:sticky;bottom:14px;margin-top:20px;background:#111827;border:1px solid #2c3850;border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.hidden{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.open{display:flex}.sheet{position:relative;width:min(620px,100%);max-height:85vh;overflow:auto;background:#111827;border:1px solid #2a3850;border-radius:22px;padding:22px}.close{position:sticky;top:0;float:right;width:42px;height:42px;border:1px solid #34435b;border-radius:50%;background:#1b2432;color:#fff;font-size:25px;cursor:pointer}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #243148}.remove{background:none;border:0;color:#ff8b8b;cursor:pointer}.footer{color:#7f8da1;text-align:center;padding:32px 8px 8px;font-size:13px}@media(min-width:760px){.controls{grid-template-columns:1.2fr auto;align-items:center}}@media(max-width:500px){.wrap{padding:14px}.photo{height:230px}}</style></head><body><main class="wrap"><section class="hero"><h1>📱 Catálogo de Smartphones</h1><p>Escolha seu aparelho. Pix ou cartão em até 12x com as taxas do parcelamento repassadas ao comprador.</p></section><section class="controls"><label class="search">🔎 <input id="searchInput" type="search" placeholder="Buscar por modelo, memória ou marca..."></label><div class="filters" id="filterBox"></div></section><section class="grid" id="productGrid"></section><div class="cartbar hidden" id="cartBar"><div><strong id="cartCount">0 itens</strong><div class="small">Pedido selecionado</div></div><button class="btn primary" onclick="openCart()">Ver pedido</button></div><div class="footer">Imagens ilustrativas do modelo. Cores podem variar conforme disponibilidade. Estoque e valores sujeitos a atualização.</div></main><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><script>const WHATSAPP='5516981377309',FACTORS=[1.0438433333,1.06485,1.0753866667,1.0858966667,1.0964933333,1.1070533333,1.1440366667,1.1550033333,1.1661833333,1.1773033333,1.1886366667,1.1999066667];const IMG={"Realme Note 60X":"img/realme-note-60x.webp","Realme Note 70":"img/realme-note-70.webp","Realme C71":"img/realme-c71.webp","Realme C100x":"img/realme-c100x.webp","Realme C75 5G":"img/realme-c75-5g.webp","Realme C85":"img/realme-c85.webp","Realme C85 Pro":"img/realme-c85-pro.webp","Redmi A7 Pro":"img/redmi-a7-pro.webp","Redmi 15C":"img/redmi-15c.webp","Poco C81 Pro 4G":"img/poco-c81-pro-4g.webp","Poco C85 4G":"img/poco-c85-4g.webp","Note 15 4G":"img/redmi-note-15-4g.webp","Redmi 17":"img/redmi-17.webp","Redmi 17 4G":"img/redmi-17.webp","Note 17 4G":"img/redmi-note-17-4g.webp","Note 15 Pro 4G":"img/redmi-note-15-pro-4g.webp","Note 15 Pro 5G":"img/redmi-note-15-pro-5g.webp","Note 15 Pro Plus 5G":"img/redmi-note-15-pro-plus-5g.webp","Poco M8 Pro 5G":"img/poco-m8-pro-5g.webp","Poco X8 Pro 5G":"img/poco-x8-pro-5g.webp","Poco X8 Pro Max 5G":"img/poco-x8-pro-max-5g.webp","Note 17 Pro Max 5G":"img/redmi-note-17-pro-max-5g.webp","Poco F8 Pro 5G":"img/poco-f8-pro-5g.webp","Mi 17T":"img/xiaomi-17t.webp"};const raw=[['Realme','Realme Note 60X','64GB',['Preto','Verde'],1659.75],['Realme','Realme Note 60X','128GB / 4GB RAM',['Preto','Verde'],1740.95],['Realme','Realme Note 70','128GB / 4GB RAM',['Dourado','Preto'],1832.30],['Realme','Realme Note 70','256GB / 8GB RAM',['Dourado'],1933.80],['Realme','Realme C71','128GB / 4GB RAM',['Branco','Verde'],1852.60],['Realme','Realme C71','256GB / 8GB RAM',['Branco'],2015],['Realme','Realme C100x','128GB / 4GB RAM',['Gold','Azul'],2055.60],['Realme','Realme C75 5G','256GB / 8GB RAM',['Gold','Preto'],2299.20],['Realme','Realme C85','256GB / 8GB RAM',['Azul','Preto'],2319.50],['Realme','Realme C85 Pro','256GB / 8GB RAM',['Roxo','Verde'],2441.30],['Redmi','Redmi A7 Pro','128GB / 4GB RAM',['Preto','Azul','Verde'],1781.55],['Redmi','Redmi 15C','128GB / 4GB RAM',['Azul','Preto'],1842.45],['Poco','Poco C81 Pro 4G','128GB / 4GB RAM',['Preto','Verde','Gold'],1791.70],['Poco','Poco C85 4G','256GB / 8GB RAM',['Preto','Verde','Roxo'],2015],['Redmi','Redmi 15C','256GB / 8GB RAM',['Preto','Azul','Verde'],2015],['Redmi','Note 15 4G','256GB / 8GB RAM',['Preto','Azul','Verde','Roxo'],2268.75],['Redmi','Redmi 17','128GB / 4GB RAM',['Preto','Roxo'],2065.75],['Redmi','Redmi 17 4G','256GB / 6GB RAM',['Preto','Azul','Roxo'],2309.35],['Redmi','Note 17 4G','256GB / 6GB RAM',['Azul','Roxo'],2522.50],['Redmi','Note 15 Pro 4G','256GB / 8GB RAM',['Preto','Titanium','Azul'],2603.70],['Redmi','Note 15 Pro 5G','256GB / 8GB RAM',['Preto','Titanium','Azul'],2857.45],['Redmi','Note 15 Pro Plus 5G','256GB / 8GB RAM',['Preto'],3314.20],['Poco','Poco M8 Pro 5G','256GB / 8GB RAM',['Silver','Preto'],2827],['Poco','Poco M8 Pro 5G','512GB / 12GB RAM',['Silver','Preto','Verde'],2979.25],['Poco','Poco X8 Pro 5G','256GB / 8GB RAM',['Preto','Verde','Amarelo'],3283.75],['Poco','Poco X8 Pro 5G','256GB / 8GB RAM',['Branco'],3314.20],['Poco','Poco X8 Pro 5G','512GB / 8GB RAM',['Preto','Verde'],3486.75],['Poco','Poco X8 Pro 5G','512GB / 12GB RAM',['Preto','Branco','Verde'],3567.95],['Poco','Poco X8 Pro Max 5G','256GB / 12GB RAM',['Preto','Branco','Azul'],3973.95],['Poco','Poco X8 Pro Max 5G','512GB / 12GB RAM',['Preto','Azul','Laranja','Branco'],4197.25],['Redmi','Note 17 Pro Max 5G','512GB / 8GB RAM',['Preto','Verde','Gold'],3892.75],['Poco','Poco F8 Pro 5G','256GB / 12GB RAM',['Preto','Silver'],4095.75],['Poco','Poco F8 Pro 5G','512GB / 12GB RAM',['Preto','Silver'],4451],['Xiaomi','Mi 17T','512GB / 12GB RAM',['Preto'],4501.75]];const products=raw.map((x,i)=>({id:i,brand:x[0],name:x[1],memory:x[2],colors:x[3],price:x[4],image:IMG[x[1]]||''})),els={search:document.getElementById('searchInput'),filters:document.getElementById('filterBox'),grid:document.getElementById('productGrid'),modal:document.getElementById('modal'),sheet:document.getElementById('sheet'),cartBar:document.getElementById('cartBar'),cartCount:document.getElementById('cartCount')};let active='Todos',cart=[];const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),totalCard=(p,n)=>p*FACTORS[n-1];function renderFilters(){const b=['Todos',...new Set(products.map(p=>p.brand))];els.filters.innerHTML=b.map(x=>`<button class="filter ${x===active?'active':''}" data-brand="${x}">${x}</button>`).join('');els.filters.querySelectorAll('button').forEach(x=>x.onclick=()=>{active=x.dataset.brand;renderFilters();renderProducts()})}function renderProducts(){const q=els.search.value.trim().toLowerCase(),list=products.filter(p=>(active==='Todos'||p.brand===active)&&(`${p.brand} ${p.name} ${p.memory}`).toLowerCase().includes(q));els.grid.innerHTML=list.map(p=>`<article class="card"><div class="photo"><img src="${p.image}" alt="${p.name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="fallback">📱<br>${p.name}</div></div><div class="content"><div class="brand">${p.brand}</div><div class="name">${p.name}</div><div class="specs">💾 ${p.memory}</div><div class="colors">🎨 ${p.colors.join(' • ')}</div><div><div class="price">${money(p.price)}</div><div class="pix">no Pix</div></div><div class="installment">💳 ou <strong>12x de ${money(totalCard(p.price,12)/12)}</strong><br><span class="small">Total no cartão: ${money(totalCard(p.price,12))}</span></div><div class="actions"><button class="btn cardbtn full" onclick="showInstallments(${p.id})">Ver parcelas de 1x a 12x</button><button class="btn secondary" onclick="addToCart(${p.id})">+ Pedido</button><button class="btn primary" onclick="buyNow(${p.id})">WhatsApp</button></div></div></article>`).join('')||'<p>Nenhum aparelho encontrado.</p>'}function closeSheet(){els.modal.classList.remove('open')}function showInstallments(id){const p=products[id],rows=FACTORS.map((f,k)=>{const n=k+1,t=p.price*f;return `<div class="row"><strong>${n}x de ${money(t/n)}</strong><span class="small">Total ${money(t)}</span></div>`}).join('');els.sheet.innerHTML=`<button class="close" onclick="closeSheet()">×</button><h2>${p.name}</h2><p>💰 Pix: <strong>${money(p.price)}</strong></p><h3>💳 Cartão de crédito</h3>${rows}<p class="small">Taxas de parcelamento já incluídas.</p><button class="btn primary" style="width:100%" onclick="buyNow(${id})">Tenho interesse</button>`;els.modal.classList.add('open')}function addToCart(id){if(!cart.includes(id))cart.push(id);updateCart()}function updateCart(){els.cartBar.classList.toggle('hidden',!cart.length);els.cartCount.textContent=`${cart.length} ${cart.length===1?'item':'itens'}`}function removeFromCart(id){cart=cart.filter(x=>x!==id);updateCart();openCart()}function buyNow(id){const p=products[id],msg=`Olá! Tenho interesse no ${p.name} — ${p.memory}. Valor no Pix: ${money(p.price)}. Gostaria de confirmar disponibilidade, cores e parcelamento.`;window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank')}function openCart(){const total=cart.reduce((s,id)=>s+products[id].price,0),rows=cart.map(id=>{const p=products[id];return `<div class="row"><span><strong>${p.name}</strong><br><span class="small">${p.memory} • ${money(p.price)}</span></span><button class="remove" onclick="removeFromCart(${id})">Remover</button></div>`}).join('');els.sheet.innerHTML=`<button class="close" onclick="closeSheet()">×</button><h2>Seu pedido</h2>${rows}<p><strong>Total no Pix: ${money(total)}</strong></p><button class="btn primary" style="width:100%" onclick="sendCart()">Enviar no WhatsApp</button>`;els.modal.classList.add('open')}function sendCart(){const lines=cart.map(id=>{const p=products[id];return `• ${p.name} — ${p.memory} — ${money(p.price)} no Pix`}).join('\n'),total=cart.reduce((s,id)=>s+products[id].price,0),msg=`Olá! Gostaria de consultar a disponibilidade destes aparelhos:\n\n${lines}\n\nTotal no Pix: ${money(total)}\n\nPode confirmar as cores e opções no cartão?`;window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank')}els.search.addEventListener('input',renderProducts);els.modal.addEventListener('click',e=>{if(e.target===els.modal)closeSheet()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});renderFilters();renderProducts();</script></body></html>
