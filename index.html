<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f17" />
  <title>Catálogo de Celulares</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b0f17;color:#fff}.wrap{max-width:1200px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#111827,#1f2937);border:1px solid #263247;border-radius:24px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)}.hero p{margin:0;color:#b6c0cf}.controls{display:grid;grid-template-columns:1fr;gap:12px;margin:22px 0}.search{display:flex;align-items:center;gap:10px;background:#131a25;border:1px solid #263247;border-radius:14px;padding:0 14px}.search input{width:100%;padding:14px 0;background:transparent;border:0;color:#fff;outline:none;font-size:16px}.filters{display:flex;gap:10px;flex-wrap:wrap}.filter{border:1px solid #2b3649;background:#111827;color:#dbe4f0;border-radius:999px;padding:10px 14px;cursor:pointer}.filter.active{background:#fff;color:#0b0f17}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:#111827;border:1px solid #263247;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}.brand{font-size:12px;color:#91a4bd;text-transform:uppercase;letter-spacing:.12em}.name{font-size:20px;font-weight:800;line-height:1.15}.specs,.colors{color:#b8c2d0;font-size:14px}.price{font-size:28px;font-weight:900;margin-top:auto}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}.btn-primary{background:#25D366;color:#08120c}.btn-secondary{background:#1b2432;color:#fff;border:1px solid #2d3a50}.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cartbar{position:sticky;bottom:14px;margin-top:20px;background:rgba(17,24,39,.96);backdrop-filter:blur(14px);border:1px solid #2c3850;border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.cartbar.hidden{display:none}.cartbar strong{display:block}.small{font-size:12px;color:#aeb9c8}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;padding:18px}.modal.open{display:flex}.sheet{width:min(620px,100%);max-height:80vh;overflow:auto;background:#111827;border:1px solid #2a3850;border-radius:22px;padding:20px}.sheet h2{margin-top:0}.cart-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #243148}.remove{background:none;border:0;color:#ff8b8b;cursor:pointer}.footer{color:#7f8da1;text-align:center;padding:32px 8px 8px;font-size:13px}@media(min-width:760px){.controls{grid-template-columns:1.2fr auto;align-items:center}.modal{align-items:center}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero"><h1>📱 Catálogo de Smartphones</h1><p>Escolha seu aparelho, adicione ao pedido e fale direto no WhatsApp.</p></section>
    <section class="controls"><label class="search">🔎 <input id="search" type="search" placeholder="Buscar por modelo, memória ou marca..." /></label><div class="filters" id="filters"></div></section>
    <section class="grid" id="grid"></section>
    <div class="cartbar hidden" id="cartbar"><div><strong id="cartCount">0 itens</strong><span class="small">Pedido selecionado</span></div><button class="btn btn-primary" onclick="openCart()">Ver pedido</button></div>
    <div class="footer">Estoque e cores sujeitos à disponibilidade. Valores podem ser atualizados sem aviso prévio.</div>
  </main>
  <div class="modal" id="modal" onclick="closeModal(event)"><div class="sheet" id="sheet"></div></div>
  <script>
    const whatsapp = '5516981377309';
    const products = [
      {brand:'Realme',name:'Realme Note 60X',memory:'64GB',colors:['Preto','Verde'],price:1659.75},{brand:'Realme',name:'Realme Note 60X',memory:'128GB / 4GB RAM',colors:['Preto','Verde'],price:1740.95},{brand:'Realme',name:'Realme Note 70',memory:'128GB / 4GB RAM',colors:['Dourado','Preto'],price:1832.30},{brand:'Realme',name:'Realme Note 70',memory:'256GB / 8GB RAM',colors:['Dourado'],price:1933.80},{brand:'Realme',name:'Realme C71',memory:'128GB / 4GB RAM',colors:['Branco','Verde'],price:1852.60},{brand:'Realme',name:'Realme C71',memory:'256GB / 8GB RAM',colors:['Branco'],price:2015.00},{brand:'Realme',name:'Realme C100x',memory:'128GB / 4GB RAM',colors:['Gold','Azul'],price:2055.60},{brand:'Realme',name:'Realme C75 5G',memory:'256GB / 8GB RAM',colors:['Gold','Preto'],price:2299.20},{brand:'Realme',name:'Realme C85',memory:'256GB / 8GB RAM',colors:['Azul','Preto'],price:2319.50},{brand:'Realme',name:'Realme C85 Pro',memory:'256GB / 8GB RAM',colors:['Roxo','Verde'],price:2441.30},{brand:'Redmi',name:'Redmi A7 Pro',memory:'128GB / 4GB RAM',colors:['Preto','Azul','Verde'],price:1781.55},{brand:'Redmi',name:'Redmi 15C',memory:'128GB / 4GB RAM',colors:['Azul','Preto'],price:1842.45},{brand:'Poco',name:'Poco C81 Pro 4G',memory:'128GB / 4GB RAM',colors:['Preto','Verde','Gold'],price:1791.70},{brand:'Poco',name:'Poco C85 4G',memory:'256GB / 8GB RAM',colors:['Preto','Verde','Roxo'],price:2015.00},{brand:'Redmi',name:'Redmi 15C',memory:'256GB / 8GB RAM',colors:['Preto','Azul','Verde'],price:2015.00},{brand:'Redmi',name:'Note 15 4G',memory:'256GB / 8GB RAM',colors:['Preto','Azul','Verde','Roxo'],price:2268.75},{brand:'Redmi',name:'Redmi 17',memory:'128GB / 4GB RAM',colors:['Preto','Roxo'],price:2065.75},{brand:'Redmi',name:'Redmi 17 4G',memory:'256GB / 6GB RAM',colors:['Preto','Azul','Roxo'],price:2309.35},{brand:'Redmi',name:'Note 17 4G',memory:'256GB / 6GB RAM',colors:['Azul','Roxo'],price:2522.50},{brand:'Redmi',name:'Note 15 Pro 4G',memory:'256GB / 8GB RAM',colors:['Preto','Titanium','Azul'],price:2603.70},{brand:'Redmi',name:'Note 15 Pro 5G',memory:'256GB / 8GB RAM',colors:['Preto','Titanium','Azul'],price:2857.45},{brand:'Redmi',name:'Note 15 Pro Plus 5G',memory:'256GB / 8GB RAM',colors:['Preto'],price:3314.20},{brand:'Poco',name:'Poco M8 Pro 5G',memory:'256GB / 8GB RAM',colors:['Silver','Preto'],price:2827.00},{brand:'Poco',name:'Poco M8 Pro 5G',memory:'512GB / 12GB RAM',colors:['Silver','Preto','Verde'],price:2979.25},{brand:'Poco',name:'Poco X8 Pro 5G',memory:'256GB / 8GB RAM',colors:['Preto','Verde','Amarelo'],price:3283.75},{brand:'Poco',name:'Poco X8 Pro 5G',memory:'256GB / 8GB RAM',colors:['Branco'],price:3314.20},{brand:'Poco',name:'Poco X8 Pro 5G',memory:'512GB / 8GB RAM',colors:['Preto','Verde'],price:3486.75},{brand:'Poco',name:'Poco X8 Pro 5G',memory:'512GB / 12GB RAM',colors:['Preto','Branco','Verde'],price:3567.95},{brand:'Poco',name:'Poco X8 Pro Max 5G',memory:'256GB / 12GB RAM',colors:['Preto','Branco','Azul'],price:3973.95},{brand:'Poco',name:'Poco X8 Pro Max 5G',memory:'512GB / 12GB RAM',colors:['Preto','Azul','Laranja','Branco'],price:4197.25},{brand:'Redmi',name:'Note 17 Pro Max 5G',memory:'512GB / 8GB RAM',colors:['Preto','Verde','Gold'],price:3892.75},{brand:'Poco',name:'Poco F8 Pro 5G',memory:'256GB / 12GB RAM',colors:['Preto','Silver'],price:4095.75},{brand:'Poco',name:'Poco F8 Pro 5G',memory:'512GB / 12GB RAM',colors:['Preto','Silver'],price:4451.00},{brand:'Xiaomi',name:'Mi 17T',memory:'512GB / 12GB RAM',colors:['Preto'],price:4501.75}
    ];
    let activeBrand='Todos',cart=[]; const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); const filters=['Todos',...new Set(products.map(p=>p.brand))];
    function renderFilters(){document.getElementById('filters').innerHTML=filters.map(f=>`<button class="filter ${f===activeBrand?'active':''}" onclick="setBrand('${f}')">${f}</button>`).join('')}
    function setBrand(b){activeBrand=b;renderFilters();renderProducts()}
    function renderProducts(){const q=document.getElementById('search').value.toLowerCase();const list=products.filter(p=>(activeBrand==='Todos'||p.brand===activeBrand)&&(`${p.brand} ${p.name} ${p.memory}`.toLowerCase().includes(q)));document.getElementById('grid').innerHTML=list.map(p=>{const idx=products.indexOf(p);return `<article class="card"><div class="brand">${p.brand}</div><div class="name">${p.name}</div><div class="specs">💾 ${p.memory}</div><div class="colors">🎨 ${p.colors.join(' • ')}</div><div class="price">${money(p.price)}</div><div class="card-actions"><button class="btn btn-secondary" onclick="addToCart(${idx})">+ Pedido</button><button class="btn btn-primary" onclick="buyNow(${idx})">WhatsApp</button></div></article>`}).join('')||'<p>Nenhum aparelho encontrado.</p>'}
    function addToCart(i){if(!cart.includes(i))cart.push(i);updateCartBar()}
    function removeFromCart(i){cart=cart.filter(x=>x!==i);updateCartBar();openCart()}
    function updateCartBar(){const bar=document.getElementById('cartbar');bar.classList.toggle('hidden',cart.length===0);document.getElementById('cartCount').textContent=`${cart.length} ${cart.length===1?'item':'itens'}`}
    function buyNow(i){const p=products[i];const msg=`Olá! Tenho interesse no ${p.name} — ${p.memory}, por ${money(p.price)}. Gostaria de confirmar disponibilidade e cores.`;window.open(`https://wa.me/${whatsapp}?text=${encodeURIComponent(msg)}`,'_blank')}
    function openCart(){const total=cart.reduce((s,i)=>s+products[i].price,0);const html=cart.length?cart.map(i=>{const p=products[i];return `<div class="cart-item"><div><strong>${p.name}</strong><div class="small">${p.memory} • ${money(p.price)}</div></div><button class="remove" onclick="removeFromCart(${i})">Remover</button></div>`}).join(''):'<p>Seu pedido está vazio.</p>';document.getElementById('sheet').innerHTML=`<h2>Seu pedido</h2>${html}${cart.length?`<p><strong>Total: ${money(total)}</strong></p><button class="btn btn-primary" style="width:100%" onclick="sendCart()">Enviar pedido no WhatsApp</button>`:''}`;document.getElementById('modal').classList.add('open')}
    function sendCart(){const lines=cart.map(i=>{const p=products[i];return `• ${p.name} — ${p.memory} — ${money(p.price)}`}).join('\n');const total=cart.reduce((s,i)=>s+products[i].price,0);const msg=`Olá! Gostaria de consultar a disponibilidade destes aparelhos:\n\n${lines}\n\nTotal de referência: ${money(total)}\n\nPode me confirmar as cores disponíveis?`;window.open(`https://wa.me/${whatsapp}?text=${encodeURIComponent(msg)}`,'_blank')}
    function closeModal(e){if(e.target.id==='modal')document.getElementById('modal').classList.remove('open')}
    document.getElementById('search').addEventListener('input',renderProducts);renderFilters();renderProducts();
  </script>
</body>
</html>
