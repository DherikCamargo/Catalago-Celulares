name: Adicionar botao fechar modal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adicionar botao fechar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<div class="sheet" id="sheet"></div>'
          new='<div class="sheet" id="sheet"></div>'
          # Adiciona estilo do botao de fechar ao modal
          if '.close-btn{' not in s:
              s=s.replace('.sheet h2{margin-top:0}', '.sheet h2{margin-top:0}.close-btn{position:sticky;top:0;float:right;width:42px;height:42px;border:1px solid #34435b;border-radius:50%;background:#1b2432;color:#fff;font-size:24px;line-height:1;cursor:pointer;z-index:2}.close-btn:hover{background:#263247}')
          # Insere X no topo de qualquer conteudo aberto no modal
          s=s.replace("sheet.innerHTML=`<h2>${p.name}</h2>", "sheet.innerHTML=`<button class=\"close-btn\" aria-label=\"Fechar\" onclick=\"closeSheet()\">×</button><h2>${p.name}</h2>")
          s=s.replace("sheet.innerHTML=`<h2>Seu pedido</h2>", "sheet.innerHTML=`<button class=\"close-btn\" aria-label=\"Fechar\" onclick=\"closeSheet()\">×</button><h2>Seu pedido</h2>")
          # Funcao explicita para fechar e suporte a tecla Esc
          marker="function closeModal(e){if(e.target.id==='modal')modal.classList.remove('open')}"
          replacement="function closeSheet(){modal.classList.remove('open')}function closeModal(e){if(e.target.id==='modal')closeSheet()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()})"
          if 'function closeSheet()' not in s:
              s=s.replace(marker,replacement)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Adiciona botao fechar nas janelas"
          git push